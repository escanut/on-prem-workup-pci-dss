services:

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: workup-monitoring-tunnel
    restart: unless-stopped
    environment:
      TUNNEL_TOKEN: ${MONITOR_CLOUDFLARE_TOKEN}
    command: >
      tunnel --no-autoupdate run
    

  prometheus:
    image: prom/prometheus:latest
    container_name: workup-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-remote-write-receiver   # critical: accepts remote_write
      - --web.enable-lifecycle
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  loki:
    image: grafana/loki:latest
    container_name: workup-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki

  grafana:
    image: grafana/grafana:latest
    container_name: workup-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: https://grafana.victorojeje.xyz
      
      GF_AUTH_PROXY_ENABLED: "true"
      GF_AUTH_PROXY_HEADER_NAME: "Cf-Access-Authenticated-User-Email"
      GF_AUTH_PROXY_AUTO_SIGN_UP: "true"
      GF_AUTH_PROXY_SYNC_TTL: "60"

      GF_AUTH_PROXY_WHITELIST: ""

      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_BASIC_ENABLED: "false"


      GF_USERS_AUTO_ASSIGN_ORG: "true"
      GF_USERS_AUTO_ASSIGN_ORG_ROLE: "Admin"
      GF_USERS_AUTO_ASSIGN_ORG_ID: "1"

      GF_AUTH_GENERIC_OAUTH_ENABLED: "false"


    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - loki

  alloy:
    image: grafana/alloy:latest
    container_name: workup-observability-alloy
    restart: unless-stopped
    volumes:
      - ./alloy-config.river:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/log/audit:/var/log/audit:ro
      - /var/log/journal:/var/log/journal:ro
      - /run/log/journal:/run/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
      - /var/log/aide:/var/log/aide:ro
    command: run /etc/alloy/config.alloy
    depends_on:
      - prometheus
      - loki
      - grafana
  
volumes:
  prometheus-data:
  loki-data:
  grafana-data:
    
    
  