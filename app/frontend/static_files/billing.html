<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Billing — WorkUp</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <nav class="nav">
    <a href="index.html" class="nav-logo">
      <div class="nav-logo-mark"></div>
      WorkUp
    </a>
    <div class="nav-links">
      <a href="dashboard.html">Board</a>
      <a href="billing.html">Billing</a>
    </div>
    <div class="nav-actions">
      <button id="logout-btn" class="btn btn-ghost">Log out</button>
    </div>
  </nav>

  <div class="billing-wrap">
    <div class="plan-card">
      <div style="color: var(--text-muted); font-size: 14px;">WorkUp workspace</div>
      <div class="price">$49<span>/month</span></div>
      <ul>
        <li>Unlimited boards</li>
        <li>Unlimited members</li>
        <li>Full task history</li>
        <li>Email support</li>
      </ul>
      <button id="subscribe-btn" class="btn btn-primary">Subscribe</button>
    </div>
  </div>

  <!-- Stripe Embedded Checkout renders inside this modal -->
  <div id="checkout-modal" class="modal-overlay">
    <div class="modal-box">
      <button id="checkout-close" class="modal-close">&times;</button>
      <div id="checkout-container"></div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/nav.js"></script>
  <script src="https://js.stripe.com/v3/"></script>
  <script src="js/billing.js"></script>
</body>
</html>
