<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in — WorkUp</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <nav class="nav">
    <a href="index.html" class="nav-logo">
      <div class="nav-logo-mark"></div>
      WorkUp
    </a>
  </nav>

  <div class="auth-wrap">
    <div class="auth-card">
      <h2>Welcome back</h2>
      <p>Sign in to get to your boards. Authentication is handled by Keycloak, WorkUp never sees your password.</p>
      <button id="login-btn" class="btn btn-primary">Continue to sign in</button>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.getElementById("login-btn").addEventListener("click", () => Auth.login());
  </script>
</body>
</html>
