# .github/workflows/mirror-to-gitlab.yml
name: Mirror to GitLab

on: [push]

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.GITLAB_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan gitlab.com >> ~/.ssh/known_hosts

      - name: Push to GitLab without .github
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git remote add gitlab git@gitlab.com:${{ secrets.GITLAB_USERNAME }}/on-prem-workup-pci-dss.git
          git checkout -b mirror-temp
          git rm -r .github
          git commit -m "temp: remove .github for GitLab mirror"
          git push gitlab mirror-temp:main --force
          git checkout main
          git branch -D mirror-temp