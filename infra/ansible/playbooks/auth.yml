---
- name: Auth - deploy keycloak
  hosts: auth
  gather_facts: true

  vars_files:
    - ../vars/secrets.yml
    - ../vars/management.yml
    - ../vars/os_hardening.yml
    
  vars:
    deploy_dir: /opt/workup-auth
    repo_url: "git@gitlab.com:ojejevictor/on-prem-workup-pci-dss.git"
    auth_dir: "{{ deploy_dir }}/app/auth"
 
  
  tasks:

    - name: Configure host firewall
      ansible.builtin.import_tasks: tasks/host_firewall.yml
      tags: [firewall]

    - name: Apply base OS hardening
      ansible.builtin.import_tasks: tasks/os_hardening.yml
      tags: [hardening]
    
    - name: PCI DSS host audit logging
      ansible.builtin.import_tasks: tasks/auditd.yml
      tags: [auditd, hardening]

    - name: Setup AIDE for file monitoring
      ansible.builtin.import_tasks: tasks/aide.yml
      tags: [aide, integrity]
      
    - name: Ping the host
      ansible.builtin.ping:

    - name: Confirm docker is installed
      ansible.builtin.command: docker --version
      register: docker_check
      changed_when: false

    - name: Confirm git is installed
      ansible.builtin.command: git --version
      register: git_check
      changed_when: false

    - name: Ensure docker service is running
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: true

    - name: Create deploy directory
      ansible.builtin.file:
        path: "{{ deploy_dir }}"
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: "0755"

    - name: Ensure .ssh directory exists on VM
      file:
        path: /home/ubuntu/.ssh
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: "0700"

    - name: Push deploy private key to VM
      copy:
        content: "{{ deploy_private_key }}"
        dest: /home/ubuntu/.ssh/workup_repo_key
        owner: ubuntu
        mode: "0600"
      no_log: true

    - name: Ensure known_hosts file exists
      ansible.builtin.file:
        path: /home/ubuntu/.ssh/known_hosts
        state: touch
        owner: ubuntu
        group: ubuntu
        mode: "0644"
      become: false

    - name: Clear stale GitLab known_hosts entry
      ansible.builtin.command:
        cmd: ssh-keygen -f /home/ubuntu/.ssh/known_hosts -R gitlab.com
      become: false
      changed_when: false
      failed_when: false
    
    - name: Check if repo already initialized
      ansible.builtin.stat:
        path: "{{ deploy_dir }}/.git"
      register: git_dir
      become: false

    - name: Initialize sparse-checkout repo (first run only)
      become: false
      when: not git_dir.stat.exists
      block:
        - name: Init empty git repo
          ansible.builtin.command:
            cmd: git init
            chdir: "{{ deploy_dir }}"
 
        - name: Add GitLab remote
          ansible.builtin.command:
            cmd: git remote add origin {{ repo_url }}
            chdir: "{{ deploy_dir }}"
 
        - name: Enable sparse-checkout (cone mode)
          ansible.builtin.command:
            cmd: git sparse-checkout init --cone
            chdir: "{{ deploy_dir }}"
 
        - name: Restrict sparse-checkout to app/auth only
          ansible.builtin.command:
            cmd: git sparse-checkout set app/auth
            chdir: "{{ deploy_dir }}"

    - name: Ensure correct remote URL
      ansible.builtin.command:
        cmd: git remote set-url origin {{ repo_url }}
        chdir: "{{ deploy_dir }}"
      become: false
      changed_when: false

    - name: Fetch and reset to latest main (only downloads app/auth blobs)
      ansible.builtin.shell: |
        GIT_SSH_COMMAND="ssh -i /home/ubuntu/.ssh/workup_repo_key -o StrictHostKeyChecking=accept-new" \
        git fetch origin main && git reset --hard origin/main
      args:
        chdir: "{{ deploy_dir }}"
      become: false

    - name: Write .env from variables
      ansible.builtin.template:
        src: "{{ playbook_dir }}/templates/auth.env.j2"
        dest: "{{ auth_dir }}/.env"
        owner: ubuntu
        group: ubuntu
        mode: "0600"
      no_log: true

    - name: Pull images
      community.docker.docker_compose_v2:
        project_src: "{{ auth_dir }}"
        pull: always
        state: present
    
    - name: Bring the stack up
      community.docker.docker_compose_v2:
        project_src: "{{ auth_dir }}"
        state: present
        recreate: always

    - name: Make bootstrap.sh executable
      ansible.builtin.file:
        path: "{{ auth_dir }}/bootstrap.sh"
        mode: "0755"
        owner: ubuntu
        group: ubuntu

    - name: Wait for Keycloak to become ready
      ansible.builtin.uri:
        url: "http://localhost:8080/realms/master"
        status_code: 200
        return_content: false
      register: keycloak_ready
      until: keycloak_ready.status == 200
      retries: 40
      delay: 5
      become: false

    - name: Run Keycloak bootstrap script
      ansible.builtin.command:
        cmd: ./bootstrap.sh
        chdir: "{{ auth_dir }}"
      register: bootstrap_result
      changed_when: "'Bootstrap complete' in bootstrap_result.stdout"
      become: false

    - name: Show bootstrap output
      ansible.builtin.debug:
        var: bootstrap_result.stdout_lines
      when: bootstrap_result.stdout_lines is defined

  handlers:
  - name: Restart ssh
    ansible.builtin.systemd:
      name: ssh
      state: restarted

  - name: Reload auditd rules
    ansible.builtin.command: augenrules --load
    changed_when: true
  
  - name: Rebuild AIDE database
    ansible.builtin.shell: |
      aide --init --config=/etc/aide/aide.conf
      mv -f /var/lib/aide/aide.db.new /var/lib/aide/aide.db
    args:
      executable: /bin/bash
    
