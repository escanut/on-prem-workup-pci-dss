---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install useful hardening packages
  ansible.builtin.apt:
    name:
      - unattended-upgrades
      - apt-listchanges
      - fail2ban
      - auditd
      - jq
      - chrony
      - libpam-pwquality
    state: present

- name: Enable unattended-upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";
    mode: "0644"

- name: Harden sshd_config
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
    state: present
    validate: /usr/sbin/sshd -t -f %s
  loop:
    - { regexp: '^#?PermitRootLogin',          line: 'PermitRootLogin no' }
    - { regexp: '^#?PasswordAuthentication',   line: 'PasswordAuthentication no' }
    - { regexp: '^#?PubkeyAuthentication',     line: 'PubkeyAuthentication yes' }
    - { regexp: '^#?X11Forwarding',            line: 'X11Forwarding no' }
    - { regexp: '^#?MaxAuthTries',             line: 'MaxAuthTries 3' }
    - { regexp: '^#?ClientAliveInterval',      line: 'ClientAliveInterval 300' }
    - { regexp: '^#?ClientAliveCountMax',      line: 'ClientAliveCountMax 2' }
    - { regexp: '^#?AllowAgentForwarding',     line: 'AllowAgentForwarding no' }
    - { regexp: '^#?AllowTcpForwarding',       line: 'AllowTcpForwarding no' }
  notify: Restart ssh

- name: Apply sysctl hardening
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    state: present
    reload: true
    sysctl_file: /etc/sysctl.d/99-hardening.conf
  loop:
    - { name: 'net.ipv4.conf.all.rp_filter',             value: '1' }
    - { name: 'net.ipv4.conf.default.rp_filter',         value: '1' }
    - { name: 'net.ipv4.icmp_echo_ignore_broadcasts',    value: '1' }
    - { name: 'net.ipv4.conf.all.accept_redirects',      value: '0' }
    - { name: 'net.ipv4.conf.default.accept_redirects',  value: '0' }
    - { name: 'net.ipv4.conf.all.send_redirects',        value: '0' }
    - { name: 'net.ipv4.conf.all.accept_source_route',   value: '0' }
    - { name: 'net.ipv4.conf.default.accept_source_route', value: '0' }
    - { name: 'net.ipv4.tcp_syncookies',                 value: '1' }
    - { name: 'kernel.randomize_va_space',               value: '2' }
    - { name: 'fs.protected_hardlinks',                  value: '1' }
    - { name: 'fs.protected_symlinks',                   value: '1' }
    - { name: 'fs.suid_dumpable', value: '0' }
    - { name: 'kernel.dmesg_restrict', value: '1' }
    - { name: 'kernel.kptr_restrict', value: '2' }

- name: Ensure fail2ban is enabled
  ansible.builtin.systemd:
    name: fail2ban
    enabled: true
    state: started

- name: Scope ubuntu sudo to required commands only
  ansible.builtin.copy:
    dest: /etc/sudoers.d/90-ubuntu-scoped
    content: |
      ubuntu ALL=(ALL) NOPASSWD: /usr/bin/docker, /usr/bin/systemctl, /usr/sbin/ufw
    mode: "0440"
    validate: "visudo -cf %s"

- name: Disable unnecessary services
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: false
    state: stopped
  loop:
    - motd-news.timer
    - multipathd
  failed_when: false

- name: Purge snapd
  ansible.builtin.apt:
    name: snapd
    state: absent
    purge: true
  failed_when: false

- name: Disable core dumps
  ansible.builtin.lineinfile:
    path: /etc/security/limits.conf
    line: "* hard core 0"
    state: present

- name: Disable systemd-timesyncd
  ansible.builtin.systemd:
    name: systemd-timesyncd
    enabled: false
    state: stopped
  failed_when: false

- name: Ensure chrony is enabled and started
  ansible.builtin.systemd:
    name: chrony
    enabled: true
    state: started