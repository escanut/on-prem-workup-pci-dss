---
# AIDE — File Integrity Monitoring (PCI DSS 10.3.4 / 11.5.2)

- name: Install AIDE
  ansible.builtin.package:
    name:
      - aide
      - aide-common
    state: present

- name: Ensure AIDE log directory exists
  ansible.builtin.file:
    path: /var/log/aide
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Deploy AIDE configuration
  ansible.builtin.template:
    src: templates/aide.conf.j2
    dest: /etc/aide/aide.conf
    owner: root
    group: root
    mode: "0644"
  notify: Rebuild AIDE database


- name: Check if AIDE database already exists
  ansible.builtin.stat:
    path: /var/lib/aide/aide.db
  register: aide_db_stat


- name: Initialize AIDE database (first run only, single scan)
  ansible.builtin.command: aideinit
  args:
    creates: /var/lib/aide/aide.db
  when: not aide_db_stat.stat.exists


- name: Install daily AIDE integrity check cron
  ansible.builtin.cron:
    name: "AIDE daily integrity check"
    minute: "17"
    hour: "3"
    user: root
    job: "/usr/bin/aide --check > /var/log/aide/aide-check.log 2>&1 || true"
    state: present

- name: Configure logrotate for AIDE reports
  ansible.builtin.copy:
    dest: /etc/logrotate.d/aide
    owner: root
    group: root
    mode: "0644"
    content: |
      /var/log/aide/*.log {
          weekly
          rotate 12
          compress
          delaycompress
          missingok
          notifempty
          create 0640 root root
          copytruncate
      }