---
- name: Backend - deploy Go API + Postgres + cloudflared tunnel
  hosts: backend
  gather_facts: true

  vars_files:
    - ../vars/secrets.yml

  vars:
    deploy_dir: /opt/workup-backend
    repo_url: "git@gitlab.com:ojejevictor/on-prem-workup-pci-dss.git"
    backend_dir: "{{ deploy_dir }}/app/backend"

  tasks:
    - name: Ping the host
      ansible.builtin.ping:

    - name: Confirm docker is installed
      ansible.builtin.command: docker --version
      register: docker_check
      changed_when: false

    - name: Confirm git is installed
      ansible.builtin.command: git --version
      register: git_check
      changed_when: false

    - name: Ensure docker service is running
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: true

    - name: Create deploy directory
      ansible.builtin.file:
        path: "{{ deploy_dir }}"
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: "0755"

    - name: Ensure .ssh directory exists on VM
      ansible.builtin.file:
        path: /home/ubuntu/.ssh
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: "0700"

    - name: Push deploy private key to VM
      ansible.builtin.copy:
        content: "{{ deploy_private_key }}"
        dest: /home/ubuntu/.ssh/workup_repo_key
        owner: ubuntu
        mode: "0600"
      no_log: true

    - name: Ensure known_hosts file exists
      ansible.builtin.file:
        path: /home/ubuntu/.ssh/known_hosts
        state: touch
        owner: ubuntu
        group: ubuntu
        mode: "0644"
      become: false

    - name: Clear stale GitLab known_hosts entry
      ansible.builtin.command:
        cmd: ssh-keygen -f /home/ubuntu/.ssh/known_hosts -R gitlab.com
      become: false
      changed_when: false
      failed_when: false

    - name: Check if repo already initialized
      ansible.builtin.stat:
        path: "{{ deploy_dir }}/.git"
      register: git_dir
      become: false

    - name: Initialize sparse-checkout repo (first run only)
      become: false
      when: not git_dir.stat.exists
      block:
        - name: Init empty git repo
          ansible.builtin.command:
            cmd: git init
            chdir: "{{ deploy_dir }}"

        - name: Add GitLab remote
          ansible.builtin.command:
            cmd: git remote add origin {{ repo_url }}
            chdir: "{{ deploy_dir }}"

        - name: Enable sparse-checkout (cone mode)
          ansible.builtin.command:
            cmd: git sparse-checkout init --cone
            chdir: "{{ deploy_dir }}"

        - name: Restrict sparse-checkout to app/backend only
          ansible.builtin.command:
            cmd: git sparse-checkout set app/backend
            chdir: "{{ deploy_dir }}"

    - name: Ensure correct remote URL
      ansible.builtin.command:
        cmd: git remote set-url origin {{ repo_url }}
        chdir: "{{ deploy_dir }}"
      become: false
      changed_when: false

    - name: Fetch and reset to latest main (only downloads app/backend blobs)
      ansible.builtin.shell: |
        GIT_SSH_COMMAND="ssh -i /home/ubuntu/.ssh/workup_repo_key -o StrictHostKeyChecking=accept-new" \
        git fetch origin main && git reset --hard origin/main
      args:
        chdir: "{{ deploy_dir }}"
      become: false

    - name: Write .env from variables
      ansible.builtin.template:
        src: "{{ playbook_dir }}/templates/backend.env.j2"
        dest: "{{ backend_dir }}/.env"
        owner: ubuntu
        group: ubuntu
        mode: "0600"
      no_log: true

    - name: Log in to GitLab Container Registry
      community.docker.docker_login:
        registry_url: registry.gitlab.com
        username: "{{ gitlab_registry_user }}"      
        password: "{{ gitlab_registry_password }}"
      no_log: true

    - name: Pull images 
      community.docker.docker_compose_v2:
        project_src: "{{ backend_dir }}"
        pull: always
        build: always
        state: present

    - name: Bring the stack up
      community.docker.docker_compose_v2:
        project_src: "{{ backend_dir }}"
        state: present
        recreate: always